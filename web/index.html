<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قرآن مجید — All Surahs</title>
  <style>
    :root {
      --bg1: #0a1628; --bg2: #12243d; --gold: #d4af37; --gold-light: #f0d878;
      --cream: #faf6ee; --card: rgba(255,255,255,0.06); --card-hover: rgba(212,175,55,0.1);
      --border: rgba(212,175,55,0.2); --text: #e8e0d0; --muted: #9aa8b8;
      --toolbar-bg: rgba(10,22,40,0.92); --font-size: 36px; --err: #ef5350;
    }
    body.theme-light {
      --bg1: #fff; --bg2: #f7f7f7; --gold: #1b5e20; --gold-light: #2e7d32;
      --cream: #111; --card: rgba(0,0,0,0.03); --card-hover: rgba(0,0,0,0.06);
      --border: rgba(0,0,0,0.12); --text: #222; --muted: #555; --toolbar-bg: rgba(255,255,255,0.95);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg1); color: var(--text); min-height: 100vh; }
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: linear-gradient(160deg, var(--bg1), var(--bg2)); }
    .wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.6rem; color: var(--gold-light); font-weight: 400; }
    header p { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
    .toolbar { position: sticky; top: 0; z-index: 10; background: var(--toolbar-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 20px;
      display: flex; flex-direction: column; gap: 12px; }
    .toolbar-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
    .search-wrap { flex: 1; min-width: 200px; max-width: 320px; }
    #surahSearch, #surahSelect { width: 100%; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: 10px; background: rgba(0,0,0,0.25); color: var(--text); font-size: 0.9rem; }
    #surahSelect { min-width: 220px; max-width: 400px; cursor: pointer; }
    .btn, .toggle-btn { padding: 9px 16px; border: 1px solid var(--border); background: transparent;
      color: var(--gold-light); border-radius: 10px; cursor: pointer; font-size: 0.85rem; }
    .btn:hover:not(:disabled), .toggle-btn.on { background: var(--gold); color: #fff; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .size-control { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--muted); }
    .meta-bar { text-align: center; padding: 12px 16px; margin-bottom: 16px; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; font-size: 0.85rem; color: var(--muted); }
    .meta-bar strong { color: var(--gold-light); font-size: 1.1rem; display: block; margin-bottom: 4px; }
    .page-section { margin-bottom: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .page-header { display: flex; justify-content: space-between; padding: 10px 18px;
      background: rgba(212,175,55,0.08); border-bottom: 1px solid var(--border); font-size: 0.78rem; color: var(--muted); direction: ltr; }
    .page-body { padding: 24px 32px; }
    .mushaf-line { font-weight: bold; font-size: var(--font-size); line-height: 2.3; direction: rtl;
      text-align: justify; text-align-last: center; color: var(--cream); margin-bottom: 0.25em; }
    .glyph { display: inline-block; padding: 0 1px; }
    .status { text-align: center; padding: 60px 20px; color: var(--muted); }
    .status.error { color: var(--err); }
    .page-jump { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 16px; }
    .page-jump button { padding: 5px 10px; font-size: 0.72rem; border: 1px solid var(--border);
      background: transparent; color: var(--muted); border-radius: 6px; cursor: pointer; }
    .speech-panel { margin: 24px 0; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .speech-panel h2 { font-size: 1rem; color: var(--gold-light); margin-bottom: 8px; }
    .speech-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 10px 0 14px; }
    .speech-log { font-size: 0.82rem; color: var(--muted); line-height: 1.7; background: rgba(0,0,0,0.2); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
    .speech-log strong { color: var(--gold-light); }
    .speech-log.live-ok { border-color: rgba(80,255,150,0.65); }
    .speech-log.live-error { border-color: rgba(255,80,80,0.75); }
    .speech-result { margin-top: 10px; white-space: pre-wrap; }
    .word-status { display: inline-block; margin-right: 4px; padding: 2px 6px; border-radius: 5px; background: rgba(255,255,255,0.06); }
    .word-status.ok { background: rgba(40,255,110,0.18); color: #8aff9a; border: 1px solid #44ff87; }
    .word-status.bad { background: rgba(255,80,80,0.12); color: #ff9b9b; border: 1px solid #ff6a6a; }
    .live-grade-wrap { margin-top: 12px; }
    .live-grade-legend { display: flex; gap: 10px; margin-bottom: 10px; font-size: 0.75rem; }
    .legend-chip { padding: 3px 10px; border-radius: 6px; }
    .legend-chip.ok { background: rgba(40,255,110,0.18); color: #8aff9a; border: 1px solid #44ff87; }
    .legend-chip.bad { background: rgba(255,80,80,0.12); color: #ff9b9b; border: 1px solid #ff6a6a; }
    .legend-chip.missed { background: rgba(255,210,60,0.14); color: #ffe28a; border: 1px solid #ffd23c; }
    .live-grade-text { direction: rtl; text-align: right; font-size: 1.5rem; line-height: 2.4; background: rgba(0,0,0,0.2); border-radius: 12px; padding: 16px 20px; }
    .live-word { display: inline-block; margin: 0 3px; padding: 2px 8px; border-radius: 6px; background: rgba(255,255,255,0.05); transition: background 0.2s, color 0.2s; }
    .live-word.ok { background: rgba(40,255,110,0.2); color: #8aff9a; }
    .live-word.bad { background: rgba(255,80,80,0.18); color: #ff9b9b; }
    .live-word.missed { background: rgba(255,210,60,0.2); color: #ffe28a; }
    .live-word.pending { color: var(--muted); }

    .debug-panel { margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 14px; }
    .debug-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
    .debug-panel-header h3 { margin: 0; font-size: 0.95rem; color: var(--muted); }
    .debug-panel-actions { display: flex; align-items: center; gap: 8px; }
    .debug-count { font-size: 0.75rem; color: var(--muted); }
    .btn-small { padding: 4px 10px; font-size: 0.75rem; }
    .debug-log { max-height: 320px; overflow-y: auto; background: #0a0a0a; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px; font-family: 'Courier New', monospace; font-size: 0.72rem; line-height: 1.5; }
    .debug-entry { padding: 6px 8px; margin-bottom: 4px; border-radius: 5px; border-left: 3px solid #555; white-space: pre-wrap; word-break: break-word; }
    .debug-entry.dbg-info { border-left-color: #6aa9ff; background: rgba(106,169,255,0.06); }
    .debug-entry.dbg-ok { border-left-color: #44ff87; background: rgba(68,255,135,0.06); }
    .debug-entry.dbg-warn { border-left-color: #ffd23c; background: rgba(255,210,60,0.06); }
    .debug-entry.dbg-error { border-left-color: #ff6a6a; background: rgba(255,106,106,0.08); }
    .debug-time { color: #888; margin-right: 6px; }
    .debug-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-weight: bold; margin-right: 6px; font-size: 0.68rem; }
    .debug-entry.dbg-info .debug-tag { background: rgba(106,169,255,0.2); color: #a9cbff; }
    .debug-entry.dbg-ok .debug-tag { background: rgba(68,255,135,0.2); color: #8aff9a; }
    .debug-entry.dbg-warn .debug-tag { background: rgba(255,210,60,0.2); color: #ffe28a; }
    .debug-entry.dbg-error .debug-tag { background: rgba(255,106,106,0.2); color: #ff9b9b; }
    footer { text-align: center; margin-top: 32px; font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <header><h1>قرآن مجید</h1><p>تمام ۱۱۴ سورتیں · Mushaf Fonts · Offline</p></header>
    <div class="toolbar">
      <div class="toolbar-row">
        <div class="search-wrap"><input type="text" id="surahSearch" placeholder="سورہ تلاش کریں..." autocomplete="off"></div>
        <select id="surahSelect"></select>
      </div>
      <div class="toolbar-row">
        <button class="btn" id="btnPrev">◀ پچھلی</button>
        <button class="btn" id="btnNext">اگلی ▶</button>
        <div class="size-control"><label for="fontSize">سائز</label><input type="range" id="fontSize" min="22" max="56" value="36"></div>
        <button class="toggle-btn" id="btnTheme" type="button">☀️ سفید پس منظر</button>
      </div>
    </div>
    <div class="speech-panel">
      <h2>Realtime Quran Speaking & Tajweed</h2>
      <div class="speech-controls">
        <button class="btn" id="btnStartRec">🎙️ Start</button>
        <button class="btn" id="btnStopRec" disabled>⏹ Stop & Upload</button>
        <button class="btn" id="btnUseSample" disabled>Use sample</button>
      </div>
      <div class="speech-log" id="speechLog">
        <strong>Status:</strong> idle · ready for microphone
      </div>
      <div class="live-grade-wrap" id="liveGradeWrap" hidden>
        <div class="live-grade-legend">
          <span class="legend-chip ok">صحیح</span>
          <span class="legend-chip bad">غلط</span>
          <span class="legend-chip missed">چھوٹ گیا</span>
        </div>
        <div class="live-grade-text" id="liveGradeText"></div>
      </div>
      <div class="speech-result" id="speechResult"></div>

      <div class="debug-panel">
        <div class="debug-panel-header">
          <h3>Debug Log</h3>
          <div class="debug-panel-actions">
            <span id="debugCount" class="debug-count">0 entries</span>
            <button class="btn btn-small" id="btnCopyLog">📋 Copy log</button>
            <button class="btn btn-small" id="btnClearLog">🗑 Clear</button>
          </div>
        </div>
        <div class="debug-log" id="debugLog"></div>
      </div>
    </div>
    <div class="meta-bar" id="metaBar"><strong>—</strong><span id="metaDetail">لوڈ ہو رہا ہے...</span></div>
    <div class="page-jump" id="pageJump" hidden></div>
    <div id="display"><p class="status">لوڈ ہو رہا ہے...</p></div>
    <footer>604 Mushaf pages · QCF-style fonts</footer>
  </div>
  <script src="recite-match.js"></script>
  <script>
    const DATA = '../data', WOFF = '../woff';
    const API_BASE = 'https://quran.alifislam.cloud';
    const API_TOKEN = 'QURAN_1234567890abcdef';
    const RECORDING_UPLOAD_URL = '/api/recordings';
    let index = null, currentSurah = 1, loadToken = 0, lightTheme = false;
    const loadedFonts = new Set();
    const els = {
      select: document.getElementById('surahSelect'),
      search: document.getElementById('surahSearch'),
      display: document.getElementById('display'),
      meta: document.getElementById('metaDetail'),
      jump: document.getElementById('pageJump'),
      startRec: document.getElementById('btnStartRec'),
      stopRec: document.getElementById('btnStopRec'),
      speechLog: document.getElementById('speechLog'),
      speechResult: document.getElementById('speechResult'),
      liveGradeWrap: document.getElementById('liveGradeWrap'),
      liveGradeText: document.getElementById('liveGradeText'),
      debugLog: document.getElementById('debugLog'),
      debugCount: document.getElementById('debugCount'),
      btnCopyLog: document.getElementById('btnCopyLog'),
      btnClearLog: document.getElementById('btnClearLog')
    };

    // ---- Debug / diagnostics log ------------------------------------------
    // Every meaningful event (mic permission, recorder state, each chunk
    // upload's request+response, server errors, JS exceptions) is appended
    // here as plain text with a timestamp, so the user can scroll back
    // through everything that happened in this session and copy it out —
    // rather than errors silently overwriting the single-line status text
    // above, which made it impossible to see what actually went wrong.
    const debugEntries = []; // { time, level, tag, message }

    function dbgLog(tag, message, level = 'info') {
      const time = new Date().toISOString().split('T')[1].replace('Z', '');
      const entry = { time, level, tag, message: String(message) };
      debugEntries.push(entry);

      const div = document.createElement('div');
      div.className = `debug-entry dbg-${level}`;
      div.innerHTML = `<span class="debug-time">${time}</span><span class="debug-tag">${tag}</span>${escapeHtml(entry.message)}`;
      els.debugLog.appendChild(div);
      els.debugLog.scrollTop = els.debugLog.scrollHeight;
      els.debugCount.textContent = `${debugEntries.length} entries`;
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function debugLogAsText() {
      return debugEntries
        .map(e => `[${e.time}] [${e.level.toUpperCase()}] [${e.tag}] ${e.message}`)
        .join('\n');
    }

    els.btnCopyLog.addEventListener('click', async () => {
      const text = debugLogAsText() || '(no log entries yet)';
      try {
        await navigator.clipboard.writeText(text);
        els.btnCopyLog.textContent = '✅ Copied!';
      } catch (err) {
        // Clipboard API can fail (permissions, non-secure context). Fall
        // back to a selectable textarea so the user can still manually
        // copy instead of hitting a dead end.
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:200px;z-index:9999;';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        els.btnCopyLog.textContent = '⚠️ Select & copy manually';
        setTimeout(() => document.body.removeChild(ta), 8000);
      }
      setTimeout(() => { els.btnCopyLog.textContent = '📋 Copy log'; }, 2000);
    });

    els.btnClearLog.addEventListener('click', () => {
      debugEntries.length = 0;
      els.debugLog.innerHTML = '';
      els.debugCount.textContent = '0 entries';
    });

    // Catch anything that slips through try/catch blocks elsewhere too.
    window.addEventListener('error', (e) => {
      dbgLog('JS-ERROR', `${e.message} (${e.filename}:${e.lineno}:${e.colno})`, 'error');
    });
    window.addEventListener('unhandledrejection', (e) => {
      dbgLog('PROMISE-REJECTION', e.reason?.message || String(e.reason), 'error');
    });

    // ---- Live word-by-word grading (Surah 1 only, for now) -----------------
    // Expected word data is a clean Uthmani text source, separate from the
    // page-glyph JSON in data/surahs/ — those are QCF mushaf presentation
    // glyphs (per-letter ligatures tied to a specific font), not plain
    // Arabic words, so they can't be diffed against a speech transcript.
    // See data/expected/<surah>.json for the word lists this reads.
    const LIVE_GRADING_SURAHS = new Set([1]);
    let expectedFlat = null;      // flattened expected words for the active surah
    let fullTranscript = '';      // running transcript text accumulated from chunks

    async function loadExpectedWords(surahNum) {
      if (!LIVE_GRADING_SURAHS.has(surahNum)) {
        expectedFlat = null;
        return;
      }
      try {
        const padded = String(surahNum).padStart(3, '0');
        const res = await fetch(`${DATA}/expected/${padded}.json`);
        if (!res.ok) throw new Error(`expected text fetch failed (${res.status})`);
        const doc = await res.json();
        expectedFlat = ReciteMatch.flattenExpected(doc);
      } catch (err) {
        console.error('Could not load expected text for live grading:', err);
        expectedFlat = null;
      }
    }

    function renderLiveGrade(graded) {
      if (!graded) {
        els.liveGradeWrap.hidden = true;
        return;
      }
      els.liveGradeWrap.hidden = false;
      els.liveGradeText.innerHTML = graded.map(w =>
        `<span class="live-word ${w.status}">${w.word.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06DC\u06DF-\u06E8\u06EA-\u06ED]/g,'')}</span>`
      ).join('');
    }

    function resetLiveGrade() {
      fullTranscript = '';
      if (expectedFlat) {
        renderLiveGrade(ReciteMatch.gradeTranscript(expectedFlat, '', false));
      } else {
        renderLiveGrade(null);
      }
    }

    function ensureFont(id) {
      if (loadedFonts.has(id)) return Promise.resolve();
      const s = document.createElement('style');
      s.textContent = `@font-face{font-family:'${id}';src:url('${WOFF}/${id}.woff') format('woff');font-weight:bold;font-style:normal}`;
      document.head.appendChild(s);
      return (document.fonts ? document.fonts.load(`bold 16px '${id}'`) : Promise.resolve()).then(() => loadedFonts.add(id));
    }
    function renderSection(sec) {
      const lines = sec.lines.map(r => `<p class="mushaf-line" style="font-family:'${sec.font}',serif">${r.glyphs.map(g=>`<span class="glyph">${g}</span>`).join(' ')}</p>`).join('');
      return `<section class="page-section" id="page-${sec.page}"><div class="page-header"><span>صفحہ ${sec.page}</span><span>${sec.font}.woff</span></div><div class="page-body">${lines}</div></section>`;
    }
    async function loadSurah(num) {
      const token = ++loadToken; currentSurah = num;
      const entry = index.surahs.find(s => s.surah === num);
      els.display.innerHTML = '<p class="status">لوڈ ہو رہا ہے...</p>';
      const res = await fetch(`${DATA}/${entry.file}`);
      const data = await res.json();
      if (token !== loadToken) return;
      await Promise.all([...new Set(data.sections.map(s=>s.font))].map(ensureFont));
      if (token !== loadToken) return;
      document.querySelector('#metaBar strong').textContent = `${data.name_arabic} (${data.name_simple})`;
      els.meta.textContent = `سورہ ${data.surah} · ${data.verses_count} آیات · صفحات ${data.pages[0]}–${data.pages[data.pages.length-1]}`;
      els.display.innerHTML = data.sections.map(renderSection).join('');
      els.jump.hidden = data.pages.length <= 1;
      if (!els.jump.hidden) {
        els.jump.innerHTML = data.pages.map(p => `<button type="button" data-page="${p}">${p}</button>`).join('');
        els.jump.querySelectorAll('button').forEach(b => b.onclick = () => document.getElementById('page-'+b.dataset.page)?.scrollIntoView({behavior:'smooth'}));
      }
      await loadExpectedWords(num);
      resetLiveGrade();
    }
    // Wrap fetch with an explicit timeout + logging so a hung request (DNS
    // stall, dead upstream API, sandboxed/blocked network, etc.) shows up
    // clearly in the debug log within a bounded time instead of silently
    // hanging forever with no feedback in the UI.
    async function fetchWithTimeout(url, opts = {}, timeoutMs = 15000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...opts, signal: controller.signal });
      } catch (err) {
        if (err.name === 'AbortError') {
          throw new Error(`Request timed out after ${timeoutMs}ms (no response from server)`);
        }
        throw err;
      } finally {
        clearTimeout(timer);
      }
    }

    let mediaRecorder = null;
    let chunks = [];
    let stream = null;
    let liveStreaming = false;
    let chunkUploadInFlight = false; // guards against overlapping /api/transcribe-chunk calls
    let chunkUploadSkipped = 0;      // how many ticks were skipped while a prior upload was in flight

    function setSpeechLog(message, mode = 'info') {
      els.speechLog.innerHTML = message;
      els.speechLog.classList.toggle('live-ok', mode === 'ok');
      els.speechLog.classList.toggle('live-error', mode === 'error');
    }

    function renderTranscriptWords(transcript) {
      if (!transcript) return '';
      const words = String(transcript).trim().split(/\s+/).filter(Boolean);
      if (!words.length) return '';
      return words.map((w, idx) => `<span class="word-status ${idx % 2 === 0 ? 'ok' : 'bad'}">${w}</span>`).join(' ');
    }

    async function startRecording() {
      dbgLog('START', 'Start button clicked');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setSpeechLog('<strong>Status:</strong> microphone API is not available in this browser', 'error');
        dbgLog('MIC', 'navigator.mediaDevices.getUserMedia not available in this browser/context', 'error');
        return;
      }

      try {
        setSpeechLog('<strong>Status:</strong> requesting microphone access…');
        dbgLog('MIC', 'Requesting getUserMedia({ audio: true })');
        resetLiveGrade();
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        dbgLog('MIC', 'Microphone access granted', 'ok');

        const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
        dbgLog('RECORDER', `Using mimeType: "${mimeType || '(browser default)'}"`);
        mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
        chunks = [];
        liveStreaming = true;

        mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) {
            const blob = event.data;
            chunks.push(blob);
            dbgLog('CHUNK', `New chunk captured: ${blob.size} bytes, type=${blob.type}`);
            if (liveStreaming) {
              // WebM only carries its EBML header + init segment on the very
              // first ondataavailable blob - every blob after that is a raw
              // continuation fragment with no header, so ffmpeg can't decode
              // it standalone (this is why /api/transcribe-chunk was 500ing
              // on every call except sometimes the first). Send everything
              // captured so far (header + all fragments) as one cumulative
              // WebM blob each time instead of just the newest delta.
              //
              // Re-transcribing the whole growing recording gets slower every
              // tick on CPU, so ticks can start piling up faster than the
              // server can answer them. If we fired uploadChunk() on every
              // tick regardless, requests would queue up behind each other
              // until fetchWithTimeout's 15s timeout aborts an old one mid
              // response - that's what caused the WinError 10053 /
              // ConnectionAbortedError crashes server-side. Skip this tick
              // if the previous upload hasn't finished yet; the next
              // cumulative blob will include this second's audio anyway.
              if (chunkUploadInFlight) {
                chunkUploadSkipped += 1;
                dbgLog('CHUNK', `Skipping upload - previous chunk still in flight (${chunkUploadSkipped} skipped so far)`, 'warn');
              } else {
                const cumulativeBlob = new Blob(chunks, { type: mimeType || 'audio/webm' });
                uploadChunk(cumulativeBlob);
              }
            }
          } else {
            dbgLog('CHUNK', 'ondataavailable fired with 0-byte blob (ignored)', 'warn');
          }
        };

        mediaRecorder.onerror = (e) => {
          dbgLog('RECORDER', `MediaRecorder error: ${e.error?.message || e.error || 'unknown'}`, 'error');
        };

        mediaRecorder.onstop = async () => {
          dbgLog('RECORDER', 'MediaRecorder stopped, building final blob from all chunks');
          const audioBlob = new Blob(chunks, { type: mimeType || 'audio/webm' });
          dbgLog('RECORDER', `Final blob: ${audioBlob.size} bytes from ${chunks.length} chunks`);
          await uploadAudio(audioBlob);
          if (stream) {
            stream.getTracks().forEach(track => track.stop());
          }
          stream = null;
          liveStreaming = false;
        };

        mediaRecorder.start(1000);
        dbgLog('RECORDER', 'mediaRecorder.start(1000) — emitting a chunk every 1000ms', 'ok');
        els.startRec.disabled = true;
        els.stopRec.disabled = false;
        setSpeechLog('<strong>Status:</strong> live stream active… speak Quranic text');
      } catch (err) {
        setSpeechLog('<strong>Status:</strong> microphone permission error', 'error');
        dbgLog('MIC', `getUserMedia failed: ${err.name}: ${err.message}`, 'error');
        console.error(err);
      }
    }

    async function stopRecording() {
      dbgLog('STOP', 'Stop button clicked');
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        dbgLog('STOP', 'No active mediaRecorder to stop', 'warn');
        return;
      }
      liveStreaming = false;
      mediaRecorder.stop();
      els.startRec.disabled = false;
      els.stopRec.disabled = true;
      setSpeechLog('<strong>Status:</strong> stopping live stream…');
    }

    async function uploadChunk(audioChunk) {
      if (!audioChunk || audioChunk.size === 0) return;

      const endpoint = '/api/transcribe-chunk';
      const formData = new FormData();
      const fileName = `chunk-${Date.now()}-${Math.round(Math.random() * 10000)}.webm`;

      formData.append('audio', audioChunk, fileName);
      dbgLog('CHUNK-UPLOAD', `POST ${endpoint} · file=${fileName} · size=${audioChunk.size} bytes`);

      chunkUploadInFlight = true;
      try {
        const t0 = performance.now();
        const response = await fetchWithTimeout(endpoint, {
          method: 'POST',
          body: formData
        }, 15000);
        const ms = Math.round(performance.now() - t0);

        if (!response.ok) {
          const text = await response.text();
          setSpeechLog(`<strong>Status:</strong> chunk API failed (${response.status})`, 'error');
          els.speechResult.textContent = text || 'Chunk upload failed';
          dbgLog('CHUNK-UPLOAD', `Response ${response.status} ${response.statusText} in ${ms}ms · body: ${text.slice(0, 2000)}`, 'error');
          return;
        }

        const rawText = await response.clone().text();
        const json = await response.json();
        dbgLog('CHUNK-UPLOAD', `Response ${response.status} in ${ms}ms · body: ${rawText.slice(0, 2000)}`, 'ok');
        if (json.success) {
          setSpeechLog(`<strong>Status:</strong> live chunk accepted · ${json.transcript || 'transcribed'}`, 'ok');
          // Each upload now sends the FULL recording so far (see
          // ondataavailable above), so the transcript that comes back is
          // already a complete re-transcription of everything captured up
          // to this point - not a delta. Replace, don't concatenate.
          if (json.transcript) {
            fullTranscript = json.transcript.trim();
            dbgLog('TRANSCRIPT', `Updated so far: "${fullTranscript}"`);
          } else {
            dbgLog('TRANSCRIPT', 'Response had success=true but no transcript field/empty transcript', 'warn');
          }
          if (expectedFlat) {
            const graded = ReciteMatch.gradeTranscript(expectedFlat, fullTranscript, false);
            renderLiveGrade(graded);
          } else {
            els.speechResult.innerHTML = renderTranscriptWords(json.transcript || '');
          }
        } else {
          setSpeechLog('<strong>Status:</strong> live chunk call returned missing success flag', 'error');
          els.speechResult.textContent = JSON.stringify(json, null, 2);
          dbgLog('CHUNK-UPLOAD', `success flag missing/false in response: ${JSON.stringify(json)}`, 'warn');
        }
      } catch (err) {
        setSpeechLog('<strong>Status:</strong> live chunk request error', 'error');
        els.speechResult.textContent = err.message;
        dbgLog('CHUNK-UPLOAD', `fetch threw: ${err.name}: ${err.message}`, 'error');
        console.error(err);
      } finally {
        chunkUploadInFlight = false;
      }
    }

    async function uploadAudio(audioBlob) {
      const endpoint = RECORDING_UPLOAD_URL;
      const formData = new FormData();
      const fileName = `recording-${Date.now()}.webm`;

      formData.append('audio', audioBlob, fileName);
      dbgLog('SAVE', `POST ${endpoint} · file=${fileName} · size=${audioBlob.size} bytes`);

      try {
        setSpeechLog('<strong>Status:</strong> saving recording locally…');
        const t0 = performance.now();
        const response = await fetchWithTimeout(endpoint, {
          method: 'POST',
          body: formData
        }, 15000);
        const ms = Math.round(performance.now() - t0);

        if (!response.ok) {
          const text = await response.text();
          setSpeechLog(`<strong>Status:</strong> local save failed (${response.status})`, 'error');
          els.speechResult.textContent = text || 'No error details returned';
          dbgLog('SAVE', `Response ${response.status} ${response.statusText} in ${ms}ms · body: ${text.slice(0, 2000)}`, 'error');
          return;
        }

        const rawText = await response.clone().text();
        const json = await response.json();
        dbgLog('SAVE', `Response ${response.status} in ${ms}ms · body: ${rawText.slice(0, 2000)}`, 'ok');
        setSpeechLog(`<strong>Status:</strong> saved locally: ${json.file}`, 'ok');
        els.speechResult.textContent = JSON.stringify(json, null, 2);

        try {
          dbgLog('TRANSCRIBE', `POST /api/transcribe · file=${fileName} · size=${audioBlob.size} bytes`);
          const t1 = performance.now();
          const apiResponse = await fetchWithTimeout('/api/transcribe', {
            method: 'POST',
            body: formData
          }, 35000);
          const ms1 = Math.round(performance.now() - t1);

          if (!apiResponse.ok) {
            const apiText = await apiResponse.text();
            setSpeechLog(`<strong>Status:</strong> saved locally, API request failed (${apiResponse.status})`, 'error');
            els.speechResult.textContent = `${JSON.stringify(json, null, 2)}\n\nAPI: ${apiText}`;
            dbgLog('TRANSCRIBE', `Response ${apiResponse.status} ${apiResponse.statusText} in ${ms1}ms · body: ${apiText.slice(0, 3000)}`, 'error');
            return;
          }

          const apiRawText = await apiResponse.clone().text();
          const apiData = await apiResponse.json();
          dbgLog('TRANSCRIBE', `Response ${apiResponse.status} in ${ms1}ms · body: ${apiRawText.slice(0, 3000)}`, 'ok');
          setSpeechLog(`<strong>Status:</strong> saved locally and transcribed by API`, 'ok');
          els.speechResult.textContent = `${JSON.stringify(json, null, 2)}\n\n${JSON.stringify(apiData, null, 2)}`;
          // Full-file transcript from /api/transcribe is authoritative for
          // the whole recording, so re-grade against it directly rather
          // than the accumulated chunk transcript (which may have drifted
          // if any chunk uploads failed mid-stream).
          if (expectedFlat && apiData.transcript) {
            const graded = ReciteMatch.gradeTranscript(expectedFlat, apiData.transcript, true);
            renderLiveGrade(graded);
          }
        } catch (apiErr) {
          setSpeechLog('<strong>Status:</strong> saved locally, API service unavailable', 'error');
          els.speechResult.textContent = `${JSON.stringify(json, null, 2)}\n\n${apiErr.message}`;
          dbgLog('TRANSCRIBE', `fetch threw: ${apiErr.name}: ${apiErr.message}`, 'error');
        }
      } catch (err) {
        setSpeechLog('<strong>Status:</strong> request error', 'error');
        els.speechResult.textContent = err.message;
        dbgLog('SAVE', `fetch threw: ${err.name}: ${err.message}`, 'error');
        console.error(err);
      }
    }

    document.getElementById('btnTheme').onclick = () => {
      lightTheme = !lightTheme;
      document.body.classList.toggle('theme-light', lightTheme);
      document.getElementById('btnTheme').classList.toggle('on', lightTheme);
    };
    document.getElementById('btnPrev').onclick = () => currentSurah > 1 && loadSurah(currentSurah-1);
    document.getElementById('btnNext').onclick = () => currentSurah < 114 && loadSurah(currentSurah+1);
    els.select.onchange = () => loadSurah(+els.select.value);
    els.startRec.onclick = () => startRecording();
    els.stopRec.onclick = () => stopRecording();
    document.getElementById('fontSize').oninput = e => document.documentElement.style.setProperty('--font-size', e.target.value+'px');
    (async () => {
      index = await (await fetch(`${DATA}/index.json`)).json();
      index.surahs.forEach(s => { const o = document.createElement('option'); o.value = s.surah; o.textContent = `${s.surah}. ${s.name_arabic} — ${s.name_simple}`; els.select.appendChild(o); });
      await loadSurah(1);
    })();
  </script>
</body>
</html>
