<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Al-Fatihah — Live Recitation Test</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: #0f1115; color: #e8e8e8;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  h1 { font-size: 18px; font-weight: 600; color: #9fb4ff; margin: 0 0 4px; direction: ltr; }
  .sub { color: #888; font-size: 13px; margin-bottom: 20px; direction: ltr; }

  .controls { display: flex; gap: 10px; margin-bottom: 20px; direction: ltr; }
  button {
    padding: 10px 18px; border-radius: 8px; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #startBtn { background: #2e7d32; color: #fff; }
  #startBtn:disabled { background: #2a2f3a; color: #666; cursor: not-allowed; }
  #stopBtn { background: #b02a2a; color: #fff; }
  #stopBtn:disabled { background: #2a2f3a; color: #666; cursor: not-allowed; }

  .status { direction: ltr; font-size: 13px; color: #aaa; margin-bottom: 20px; min-height: 18px; }
  .status.err { color: #ff6b6b; }
  .status.ok { color: #6bcf6b; }

  .quran-box {
    background: #171a21; border: 1px solid #2a2f3a; border-radius: 12px;
    padding: 28px; font-size: 34px; line-height: 2.4; text-align: center;
  }
  .live-word { padding: 2px 4px; border-radius: 5px; transition: background .15s, color .15s; }
  .live-word.pending { color: #cfd3da; }
  .live-word.ok      { background: #1e4620; color: #7CFC7C; }
  .live-word.bad     { background: #4a1f1f; color: #ff8a8a; }
  .live-word.missed  { background: #4a411f; color: #ffd76b; }

  .legend { direction: ltr; margin-top: 16px; font-size: 12px; color: #999; display: flex; gap: 18px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .dot.ok { background: #7CFC7C; } .dot.bad { background: #ff8a8a; } .dot.missed { background: #ffd76b; } .dot.pending { background: #cfd3da; }

  #log {
    direction: ltr; margin-top: 20px; background: #0b0d11; border: 1px solid #2a2f3a;
    border-radius: 8px; padding: 10px; font-family: monospace; font-size: 11px;
    max-height: 200px; overflow-y: auto; color: #7a8; white-space: pre-wrap;
  }
</style>
</head>
<body>

  <h1>Al-Fatihah — Live Recitation Test</h1>
  <div class="sub">Standalone test page: no mushaf/page/font loading. Hardcoded expected text for Surah 1 only.</div>

  <div class="controls">
    <button id="startBtn">Start Recording</button>
    <button id="stopBtn" disabled>Stop Recording</button>
  </div>

  <div id="statusLine" class="status">Idle — click Start and begin reciting.</div>

  <div class="quran-box" id="liveGradeText"></div>

  <div class="legend">
    <span><i class="dot ok"></i> correct</span>
    <span><i class="dot bad"></i> wrong word</span>
    <span><i class="dot missed"></i> skipped</span>
    <span><i class="dot pending"></i> not reached yet</span>
  </div>

  <div id="log"></div>

  <script src="recite-match.js"></script>
  <script>
    // ---- Hardcoded Al-Fatihah expected text (clean Uthmani, no page-glyph
    // ligatures) — same shape as data/expected/001.json, just inlined so
    // this test page has zero dependency on the data/ or woff/ folders. ----
    const AL_FATIHAH = {
      verses: [
        { ayah: 1, words: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ".split(' ') },
        { ayah: 2, words: "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ".split(' ') },
        { ayah: 3, words: "الرَّحْمَٰنِ الرَّحِيمِ".split(' ') },
        { ayah: 4, words: "مَالِكِ يَوْمِ الدِّينِ".split(' ') },
        { ayah: 5, words: "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ".split(' ') },
        { ayah: 6, words: "اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ".split(' ') },
        { ayah: 7, words: "صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ".split(' ') }
      ]
    };
    const expectedFlat = ReciteMatch.flattenExpected(AL_FATIHAH);

    const els = {
      startBtn: document.getElementById('startBtn'),
      stopBtn: document.getElementById('stopBtn'),
      statusLine: document.getElementById('statusLine'),
      liveGradeText: document.getElementById('liveGradeText'),
      log: document.getElementById('log')
    };

    function log(msg) {
      const t = new Date().toLocaleTimeString();
      els.log.textContent += `[${t}] ${msg}\n`;
      els.log.scrollTop = els.log.scrollHeight;
    }

    function setStatus(msg, mode = 'info') {
      els.statusLine.textContent = msg;
      els.statusLine.className = 'status' + (mode === 'error' ? ' err' : mode === 'ok' ? ' ok' : '');
    }

    const TASHKEEL_RE = /[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06DC\u06DF-\u06E8\u06EA-\u06ED]/g;

    function renderGrade(graded) {
      els.liveGradeText.innerHTML = graded.map(w =>
        `<span class="live-word ${w.status}">${w.word.replace(TASHKEEL_RE, '')}</span>`
      ).join(' ');
    }

    function resetGrade() {
      fullTranscript = '';
      renderGrade(ReciteMatch.gradeTranscript(expectedFlat, '', false));
    }

    async function fetchWithTimeout(url, opts = {}, timeoutMs = 15000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...opts, signal: controller.signal });
      } finally {
        clearTimeout(id);
      }
    }

    // ---- Recording state ----
    let mediaRecorder = null;
    let chunks = [];
    let stream = null;
    let liveStreaming = false;
    let chunkUploadInFlight = false;
    let chunkUploadSkipped = 0;
    let fullTranscript = '';

    async function startRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('Microphone API not available in this browser', 'error');
        return;
      }
      try {
        setStatus('Requesting microphone access…');
        resetGrade();
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        log('Microphone access granted');

        const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
        mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
        chunks = [];
        liveStreaming = true;

        mediaRecorder.ondataavailable = event => {
          if (event.data.size === 0) return;
          chunks.push(event.data);
          log(`Chunk captured: ${event.data.size} bytes`);
          if (!liveStreaming) return;

          // A WebM blob only carries its EBML header on the FIRST
          // ondataavailable event - later blobs are headerless continuation
          // fragments ffmpeg can't decode alone. So we always resend
          // everything captured so far (header + all fragments), and skip
          // this tick entirely if the previous upload hasn't finished yet
          // (re-transcribing the whole growing clip gets slower each tick,
          // so overlapping requests would otherwise pile up and eventually
          // get aborted mid-response).
          if (chunkUploadInFlight) {
            chunkUploadSkipped += 1;
            log(`Skipped tick - previous chunk still uploading (${chunkUploadSkipped} total)`);
            return;
          }
          const cumulativeBlob = new Blob(chunks, { type: mimeType || 'audio/webm' });
          uploadChunk(cumulativeBlob);
        };

        mediaRecorder.onerror = e => log(`MediaRecorder error: ${e.error?.message || e.error}`);

        mediaRecorder.onstop = async () => {
          log('Recording stopped, sending full clip for final grading');
          const audioBlob = new Blob(chunks, { type: mimeType || 'audio/webm' });
          await uploadFinal(audioBlob);
          if (stream) stream.getTracks().forEach(t => t.stop());
          stream = null;
          liveStreaming = false;
        };

        mediaRecorder.start(1000);
        els.startBtn.disabled = true;
        els.stopBtn.disabled = false;
        setStatus('Live — start reciting Al-Fatihah…', 'ok');
      } catch (err) {
        setStatus(`Microphone error: ${err.name}: ${err.message}`, 'error');
      }
    }

    function stopRecording() {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
      liveStreaming = false;
      mediaRecorder.stop();
      els.startBtn.disabled = false;
      els.stopBtn.disabled = true;
      setStatus('Stopping…');
    }

    async function uploadChunk(audioChunk) {
      if (!audioChunk || audioChunk.size === 0) return;
      const formData = new FormData();
      formData.append('audio', audioChunk, `chunk-${Date.now()}.webm`);

      chunkUploadInFlight = true;
      try {
        const t0 = performance.now();
        const response = await fetchWithTimeout('/api/transcribe-chunk', { method: 'POST', body: formData }, 15000);
        const ms = Math.round(performance.now() - t0);
        if (!response.ok) {
          const text = await response.text();
          log(`Chunk upload failed (${response.status}) in ${ms}ms: ${text.slice(0, 300)}`);
          return;
        }
        const json = await response.json();
        log(`Chunk transcribed in ${ms}ms: "${json.transcript || ''}"`);
        if (json.success && json.transcript) {
          // Each upload is a re-transcription of the WHOLE clip so far
          // (cumulative, not delta) - replace, don't concatenate.
          fullTranscript = json.transcript.trim();
          renderGrade(ReciteMatch.gradeTranscript(expectedFlat, fullTranscript, false));
        }
      } catch (err) {
        log(`Chunk upload error: ${err.name}: ${err.message}`);
      } finally {
        chunkUploadInFlight = false;
      }
    }

    async function uploadFinal(audioBlob) {
      const formData = new FormData();
      formData.append('audio', audioBlob, `full-${Date.now()}.webm`);
      try {
        setStatus('Transcribing full recording…');
        const response = await fetchWithTimeout('/api/transcribe', { method: 'POST', body: formData }, 60000);
        const json = await response.json();
        if (json.success) {
          fullTranscript = (json.transcript || '').trim();
          log(`Final transcript: "${fullTranscript}"`);
          renderGrade(ReciteMatch.gradeTranscript(expectedFlat, fullTranscript, true));
          setStatus('Done.', 'ok');
        } else {
          setStatus(`Final transcription failed: ${json.message || 'unknown error'}`, 'error');
        }
      } catch (err) {
        setStatus(`Final transcription error: ${err.message}`, 'error');
      }
    }

    els.startBtn.addEventListener('click', startRecording);
    els.stopBtn.addEventListener('click', stopRecording);

    resetGrade();
  </script>
</body>
</html>
